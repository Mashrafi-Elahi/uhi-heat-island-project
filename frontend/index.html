<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UHI Heat Island Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Urban Heat Island Mapping</span>
    <span class="text-light small" id="study-area-label">Loading...</span>
  </nav>

  <div class="container-fluid py-3">
    <div class="row g-3">
      <div class="col-lg-3">
        <div class="card shadow-sm">
          <div class="card-header">Statistics</div>
          <div class="card-body" id="stats-panel">
            <p class="text-muted small">Loading...</p>
          </div>
        </div>
        <div class="card shadow-sm mt-3">
          <div class="card-header">Model Performance</div>
          <div class="card-body small" id="metrics-panel"></div>
        </div>
        <div class="card shadow-sm mt-3">
          <div class="card-header">Zone Comparison</div>
          <div class="card-body">
            <canvas id="zoneChart" height="200"></canvas>
          </div>
        </div>
        <div class="card shadow-sm mt-3">
          <div class="card-header">Time of Day</div>
          <div class="card-body">
            <canvas id="timeChart" height="180"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-9">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span>Interactive Heat Map</span>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-primary active" data-layer="field">Field Temp</button>
              <button class="btn btn-outline-danger" data-layer="heat">Heat Interpolation</button>
              <button class="btn btn-outline-warning" data-layer="predictions">Predictions</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div id="map"></div>
          </div>
        </div>
        <div class="card shadow-sm mt-3">
          <div class="card-header">Legend</div>
          <div class="card-body small">
            <span class="badge bg-success">Cool (&lt;30°C)</span>
            <span class="badge bg-warning text-dark">Warm (30–33°C)</span>
            <span class="badge bg-danger">Hot (&gt;33°C)</span>
            <span class="ms-3 text-muted">Circle size ∝ LST · Green outline = high NDVI parks</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
